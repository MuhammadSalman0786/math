<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7a8dd3">
<title>You're offline | All Math Solver</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6fb; color: #1f2937; }
  .card { max-width: 440px; width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 32px 28px; text-align: center;
          box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
  .logo { width: 84px; height: 84px; border-radius: 20px; background: #fff; box-shadow: 0 6px 16px rgba(15,23,42,.12); display: inline-flex; align-items: center; justify-content: center; }
  .logo img { width: 70px; height: 70px; object-fit: contain; }
  h1 { font-size: 1.45rem; margin: 20px 0 8px; }
  p { color: #6b7280; line-height: 1.6; margin: 0 0 20px; }
  .btn { display: inline-block; background: #4c5bab; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; }
  .links { margin-top: 18px; font-size: .9rem; }
  .links a { color: #4c5bab; margin: 0 6px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e5e7eb; }
    .card { background: #1e293b; border-color: #334155; }
    p { color: #94a3b8; }
    .links a { color: #a5b4fc; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/icons/icon-192.png" alt="All Math Solve"></div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on your device yet. Check your internet connection and try again. Pages you've opened before, the guides and your recent history still work offline.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="links"><a href="/">Math Solver</a> · <a href="/blog">Guides</a></div>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
